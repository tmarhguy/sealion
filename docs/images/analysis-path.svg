<svg xmlns="http://www.w3.org/2000/svg" width="800" height="636" viewBox="0 0 800 636" role="img" aria-labelledby="title desc">
<title id="title">Text analysis</title><desc id="desc">Raw text: Read the text of an individual field.; Tokenize: Split using Unicode-alphanumeric boundaries.; Case folding: Normalize character case.; Stop words: Remove configured stop words while preserving position gaps.; Porter stemming: Apply stemming when enabled for the field.; Terms + positions: Emit normalized tokens and their positions.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:var(--diagram-ink,#202020)}.detail{font-size:14px;fill:var(--diagram-muted,#595959)}.label{font-size:16px;font-weight:600}.num{font-family:monospace;font-size:12px;fill:var(--diagram-number,#757575)}</style>
<rect x=".5" y=".5" width="799" height="635" rx="10" fill="var(--diagram-paper,#fff)" stroke="var(--diagram-line,#dedede)"/>
<text x="28" y="35" class="label">Text analysis</text>
<text x="28" y="58" class="detail">Shared by document indexing and query normalization</text>
