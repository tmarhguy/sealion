<svg xmlns="http://www.w3.org/2000/svg" width="800" height="548" viewBox="0 0 800 548" role="img" aria-labelledby="title desc">
<title id="title">Publication protocol</title><desc id="desc">Temp file: Write the segment to a temp file in the data directory.; Fsync: Flush and fsync the temp file.; Verify: Re-read the temp file: checksums, ordering, and counts.; Rename: Atomically rename the segment into place.; Publish: Publish the new generation with an atomic manifest rename.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:var(--diagram-ink,#202020)}.detail{font-size:14px;fill:var(--diagram-muted,#595959)}.label{font-size:16px;font-weight:600}.num{font-family:monospace;font-size:12px;fill:var(--diagram-number,#757575)}</style>
<rect x=".5" y=".5" width="799" height="547" rx="10" fill="var(--diagram-paper,#fff)" stroke="var(--diagram-line,#dedede)"/>
<text x="28" y="35" class="label">Publication protocol</text>
<text x="28" y="58" class="detail">Crash-safe segment publication in five steps</text>
<rect x="28" y="78" width="744" height="72" rx="6" fill="var(--diagram-edge,#f4f4f4)" stroke="var(--diagram-line,#dedede)"/>
<text x="44" y="107" class="num">01</text>
<text x="80" y="107" class="label">Temp file</text>
<text x="80" y="129" class="detail">Write the segment to a temp file in the data directory.</text>
<path d="M 57 150 v 13 m -3 -4 l 3 4 l 3 -4" fill="none" stroke="var(--diagram-number,#999)"/>
<rect x="28" y="166" width="744" height="72" rx="6" fill="var(--diagram-row,#fafafa)" stroke="var(--diagram-line,#dedede)"/>
<text x="44" y="195" class="num">02</text>
<text x="80" y="195" class="label">Fsync</text>
<text x="80" y="217" class="detail">Flush and fsync the temp file.</text>
<path d="M 57 238 v 13 m -3 -4 l 3 4 l 3 -4" fill="none" stroke="var(--diagram-number,#999)"/>
<rect x="28" y="254" width="744" height="72" rx="6" fill="var(--diagram-row,#fafafa)" stroke="var(--diagram-line,#dedede)"/>
<text x="44" y="283" class="num">03</text>
<text x="80" y="283" class="label">Verify</text>
<text x="80" y="305" class="detail">Re-read the temp file: checksums, ordering, and counts.</text>
<path d="M 57 326 v 13 m -3 -4 l 3 4 l 3 -4" fill="none" stroke="var(--diagram-number,#999)"/>
<rect x="28" y="342" width="744" height="72" rx="6" fill="var(--diagram-row,#fafafa)" stroke="var(--diagram-line,#dedede)"/>
<text x="44" y="371" class="num">04</text>
<text x="80" y="371" class="label">Rename</text>
<text x="80" y="393" class="detail">Atomically rename the segment into place.</text>
<path d="M 57 414 v 13 m -3 -4 l 3 4 l 3 -4" fill="none" stroke="var(--diagram-number,#999)"/>
<rect x="28" y="430" width="744" height="72" rx="6" fill="var(--diagram-edge,#f4f4f4)" stroke="var(--diagram-line,#dedede)"/>
<text x="44" y="459" class="num">05</text>
<text x="80" y="459" class="label">Publish</text>
<text x="80" y="481" class="detail">Publish the new generation with an atomic manifest rename.</text>
</svg>
