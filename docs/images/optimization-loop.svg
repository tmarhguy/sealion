<svg xmlns="http://www.w3.org/2000/svg" width="800" height="548" viewBox="0 0 800 548" role="img" aria-labelledby="title desc">
<title id="title">Optimization loop</title><desc id="desc">Profile: Measure before changing anything.; Hypothesize: State the expected improvement.; Implement: Change the code.; Benchmark: Run the codec, query, and scaling harnesses.; Document: Record measured behavior; unmeasured stays TBD.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:var(--diagram-ink,#202020)}.detail{font-size:14px;fill:var(--diagram-muted,#595959)}.label{font-size:16px;font-weight:600}.num{font-family:monospace;font-size:12px;fill:var(--diagram-number,#757575)}</style>
<rect x=".5" y=".5" width="799" height="547" rx="10" fill="var(--diagram-paper,#fff)" stroke="var(--diagram-line,#dedede)"/>
<text x="28" y="35" class="label">Optimization loop</text>
<text x="28" y="58" class="detail">Every change follows measure, implement, document</text>
