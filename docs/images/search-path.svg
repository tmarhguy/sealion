<svg xmlns="http://www.w3.org/2000/svg" width="800" height="548" viewBox="0 0 800 548" role="img" aria-labelledby="title desc">
<title id="title">Search path</title><desc id="desc">Query: Receive the query through the command-line or HTTP interface.; Parse + normalize: Apply the same text analysis used during indexing.; Execute + rank: Evaluate Boolean constraints and rank the live document set.; Explain + extract: Produce snippets and per-term score explanations.; Results: Return score, title, URL, and snippet for each ranked hit.</desc>
