<svg xmlns="http://www.w3.org/2000/svg" width="800" height="548" viewBox="0 0 800 548" role="img" aria-labelledby="title desc">
<title id="title">Query pipeline</title><desc id="desc">Parse: Raw text into a query AST: Term, Phrase, Prefix, Fuzzy, Site, And/Or/Not.; Normalize: Every term through the index analysis pipeline.; Plan: Evaluation order from document frequency and posting size.; Execute: Boolean execution with exhaustive field-weighted BM25 ranking.; Explain: Parsed shape, tf/df/idf, field weights, and final score.</desc>
